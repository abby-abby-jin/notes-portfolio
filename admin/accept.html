<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>비밀번호 설정</title>
<style>
  body{
    font-family:-apple-system, "Apple SD Gothic Neo", sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; margin:0; gap:1rem; color:#333; text-align:center; padding:2rem;
  }
  button{
    padding:.8rem 1.6rem; border-radius:8px; border:none;
    background:#1c1c1e; color:#fff; font-size:1rem; cursor:pointer;
  }
  input{
    padding:.7rem .9rem; border-radius:8px; border:1px solid #ccc;
    font-size:1rem; width:240px;
  }
  a{ color:#03c75a; }
  #pw-msg{ color:#c00; font-size:.9rem; min-height:1.2em; }
</style>
</head>
<body>
  <div id="step-open">
    <p>아래 버튼을 눌러 로그인 창을 열어주세요.<br />창이 바로 안 뜨면 몇 초 기다렸다가 다시 눌러주세요.</p>
    <button id="open-btn">열기</button>
  </div>

  <div id="step-password" style="display:none;">
    <p>로그인됐어요! 앞으로 사용할 비밀번호를 정해주세요 (6자 이상).</p>
    <input type="password" id="pw1" placeholder="새 비밀번호" />
    <input type="password" id="pw2" placeholder="비밀번호 확인" />
    <button id="save-pw-btn">비밀번호 저장</button>
    <p id="pw-msg"></p>
  </div>

  <p><a href="./">이미 완료했다면 여기를 눌러 로그인하기</a></p>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    function showPasswordStep() {
      document.getElementById("step-open").style.display = "none";
      document.getElementById("step-password").style.display = "flex";
      document.getElementById("step-password").style.flexDirection = "column";
      document.getElementById("step-password").style.alignItems = "center";
      document.getElementById("step-password").style.gap = "0.8rem";
    }

    if (window.netlifyIdentity) {
      netlifyIdentity.init();
      netlifyIdentity.on("init", (user) => {
        if (user) showPasswordStep();
      });
      netlifyIdentity.on("login", () => showPasswordStep());

      document.getElementById("open-btn").addEventListener("click", () => {
        netlifyIdentity.open();
      });

      document.getElementById("save-pw-btn").addEventListener("click", () => {
        const pw1 = document.getElementById("pw1").value;
        const pw2 = document.getElementById("pw2").value;
        const msg = document.getElementById("pw-msg");
        if (pw1.length < 6) {
          msg.textContent = "비밀번호는 6자 이상으로 입력해주세요.";
          return;
        }
        if (pw1 !== pw2) {
          msg.textContent = "두 비밀번호가 서로 달라요.";
          return;
        }
        const user = netlifyIdentity.currentUser();
        if (!user) {
          msg.textContent = "로그인 상태가 아니에요. 위 '열기' 버튼을 다시 눌러주세요.";
          return;
        }
        msg.style.color = "#333";
        msg.textContent = "저장 중...";
        user
          .update({ password: pw1 })
          .then(() => {
            msg.style.color = "#03c75a";
            msg.textContent = "완료! 이제 이 비밀번호로 로그인할 수 있어요. 아래 링크를 눌러 이동해주세요.";
          })
          .catch((e) => {
            msg.style.color = "#c00";
            msg.textContent = "오류: " + e.message;
          });
      });
    }
  </script>
</body>
</html>
